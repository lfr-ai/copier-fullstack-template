parameters:
  - name: pythonVersion
    type: string
    default: '3.12'

steps:
  - task: UsePythonVersion@0
    displayName: Use Python ${{ parameters.pythonVersion }}
    inputs:
      versionSpec: '${{ parameters.pythonVersion }}'

  - bash: |
      set -euo pipefail
      python -m pip install --upgrade uv
    displayName: Install uv

  - bash: |
      set -euo pipefail
      uv sync
    displayName: Install dependencies