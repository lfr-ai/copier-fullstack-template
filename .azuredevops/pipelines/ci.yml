trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

variables:
  - template: /.azuredevops/variables/ci.yml

pool:
  vmImage: ubuntu-latest

stages:
  - stage: validate
    displayName: Validate quality gates
    jobs:
      - job: quality
        displayName: Lint, types, tests, and security
        steps:
          - checkout: self

          - template: /.azuredevops/templates/steps/setup-python.yml
            parameters:
              pythonVersion: $(PYTHON_VERSION)

          - template: /.azuredevops/templates/steps/setup-node.yml
            parameters:
              nodeVersion: $(NODE_VERSION)

          - template: /.azuredevops/templates/steps/pre-commit.yml
