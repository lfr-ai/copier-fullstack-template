name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  metadata:
    name: PR Metadata Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            template
            backend
            frontend
            infra
            ci
            copier
            hooks
            agents
            claude
            deps
          requireScope: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const changes = additions + deletions;

            if (changes > 1000) {
              core.warning(`⚠️ Large PR detected: ${changes} lines changed. Consider splitting into smaller PRs.`);
            }

            const files = pr.changed_files;
            if (files > 30) {
              core.warning(`⚠️ Many files changed: ${files} files. Consider splitting into focused PRs.`);
            }

  labeler:
    name: Auto-label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  lint-commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install commitizen
        run: pip install --user commitizen

      - name: Check commit messages
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git log --format=%H $BASE_SHA..$HEAD_SHA | while read commit; do
            echo "Checking commit: $commit"
            git show -s --format=%B $commit | cz check --commit-msg-file /dev/stdin || exit 1
          done

  actionlint:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,template-verify-all,template-render-smoke,template-rendered-tests

  template-validation:
    name: Validate template source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Check Clean Architecture boundaries
        run: |
          if rg "from.*\.(application|infrastructure|presentation|config|ai)" \
                template/backend/src/ \
                --glob "**/core/**" \
                --type-add "pytpl:*.py.jinja" \
                --type py --type pytpl; then
            echo "::error::Core layer contains outward imports (Clean Architecture violation)"
            exit 1
          fi
          echo "✅ Clean Architecture boundaries OK"

      - name: Check no Final[] on module constants
        run: |
          if rg "^[A-Z_][A-Z0-9_]*\s*:\s*Final\[" \
                template/backend/src scripts \
                --type-add "pytpl:*.py.jinja" \
                --type py --type pytpl; then
            echo "::error::Found Final[] annotations on constants (use plain UPPER_SNAKE_CASE)"
            exit 1
          fi
          echo "✅ Constant convention check OK"

      - name: Run validation script
        run: python scripts/validate-template.py

  render-smoke-test:
    name: Template render smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Configure git for post-copy hooks
        run: |
          git config --global user.name "PR Bot"
          git config --global user.email "pr-bot@test.local"

      - name: Render template with defaults
        run: |
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            -d project_name="PR Test" \
            -d project_slug="pr_test" \
            -d project_description="PR smoke test" \
            -d author_name="PR Bot" \
            -d author_email="pr-bot@test.local" \
            -d github_username="pr-bot" \
            . /tmp/pr-test-render

      - name: Verify expected files
        run: |
          EXPECTED_FILES=(
            "backend/pyproject.toml"
            "frontend/package.json"
            ".github/workflows/ci.yml"
            ".github/copilot-instructions.md"
            ".claude/settings.json"
            ".coderabbit.yaml"
          )

          for f in "${EXPECTED_FILES[@]}"; do
            if [ ! -f "/tmp/pr-test-render/$f" ]; then
              echo "::error::Missing expected file: $f"
              exit 1
            fi
          done
          echo "✅ Render smoke test passed"

  security-scan:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  link-check:
    name: Check documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: contains(github.event.pull_request.changed_files, '*.md')
    steps:
      - uses: actions/checkout@v6

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --config .lychee.toml
            --base .
            "**/*.md"
          fail: true

  summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs:
      - metadata
      - labeler
      - lint-commits
      - actionlint
      - pre-commit
      - template-validation
      - render-smoke-test
      - security-scan
    if: always()
    steps:
      - name: Check all jobs passed
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            const failed = Object.entries(jobs).filter(([name, job]) => job.result === 'failure');

            if (failed.length > 0) {
              core.setFailed(`❌ ${failed.length} validation(s) failed: ${failed.map(([name]) => name).join(', ')}`);
            } else {
              core.info('✅ All PR validations passed!');
            }
